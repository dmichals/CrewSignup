<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailing with Attitude — 2026 Schedule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;min-height:100vh;padding:16px;}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.header{background:#185FA5;padding:18px 20px 14px;}
.header h1{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px;}
.header p{font-size:13px;color:#B5D4F4;}
.tabs{display:flex;border-bottom:1px solid #eee;}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:#888;border-bottom:2px solid transparent;}
.tab.active{color:#185FA5;border-bottom-color:#185FA5;}
.section{padding:16px 20px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav button{background:#f4f6f9;border:1px solid #e0e0e0;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:16px;color:#333;}
.cal-title{font-size:15px;font-weight:600;color:#222;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dow{font-size:10px;color:#aaa;text-align:center;padding:3px 0;font-weight:600;}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;position:relative;cursor:pointer;border:1px solid transparent;}
.cd.empty,.cd.past{opacity:.25;pointer-events:none;}
.cd.thu{background:#E6F1FB;}.cd.tue{background:#EAF3DE;}.cd.wed{background:#F0EEFF;}.cd.regatta{background:#FAEEDA;}
.cd.has-crew{border-width:2px;}
.cd.thu.has-crew{border-color:#378ADD;}.cd.tue.has-crew{border-color:#639922;}.cd.wed.has-crew{border-color:#7F77DD;}.cd.regatta.has-crew{border-color:#BA7517;}
.num{font-size:12px;font-weight:600;color:#222;line-height:1;}
.crew-count{font-size:9px;color:#555;margin-top:2px;}
.tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:10;pointer-events:none;min-width:80px;text-align:center;}
.cd:hover .tooltip{display:block;}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.legend span{font-size:10px;color:#888;display:flex;align-items:center;gap:3px;}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.day-row{padding:12px 0;border-bottom:1px solid #f0f0f0;}
.day-row:last-child{border-bottom:none;}
.day-label{font-size:13px;font-weight:600;color:#222;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.day-type{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;}
.thu-badge{background:#E6F1FB;color:#185FA5;}
.tue-badge{background:#EAF3DE;color:#3B6D11;}
.wed-badge{background:#F0EEFF;color:#5B52C4;}
.regatta-badge{background:#FAEEDA;color:#8A5010;}
.crew-chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:#f4f6f9;border-radius:12px;padding:3px 10px;font-size:12px;color:#444;}
.empty-day{font-size:12px;color:#aaa;font-style:italic;}
.loading{padding:40px;text-align:center;color:#aaa;font-size:14px;}
.signup-btn{display:block;margin:16px 20px;padding:12px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Sailing with Attitude</h1>
    <p>2026 Season — who's sailing when</p>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('calendar')">Calendar</div>
    <div class="tab" onclick="showTab('list')">List</div>
  </div>
  <div id="calendar-view" class="section">
    <div class="loading" id="cal-loading">Loading schedule...</div>
    <div id="cal-wrap" style="display:none;">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">&#8249;</button>
        <span class="cal-title" id="cal-title"></span>
        <button onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="legend">
        <span><i style="background:#E6F1FB;border:1px solid #378ADD;"></i>Race Thu</span>
        <span><i style="background:#EAF3DE;border:1px solid #639922;"></i>Practice Tue</span>
        <span><i style="background:#F0EEFF;border:1px solid #7F77DD;"></i>Wed sail</span>
        <span><i style="background:#FAEEDA;border:1px solid #BA7517;"></i>Regatta</span>
      </div>
    </div>
  </div>
  <div id="list-view" class="section" style="display:none;">
    <div class="loading" id="list-loading">Loading schedule...</div>
    <div id="list-wrap" style="display:none;"></div>
  </div>
  <a href="signup.html" class="signup-btn">Sign up / update my availability</a>
</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby9GNQAD00GQRyF0qPW-MRMc1V2rSAKmRizHPbjGbU6jqAqCwcNWSigCMmsxsifq6Rwcw/exec';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS=['Su','Mo','Tu','We','Th','Fr','Sa'];
const events={
  // Saturdays
  '2026-06-06':{type:'sat',name:'AYC Sat'},
  '2026-07-11':{type:'sat',name:'AYC Sat'},
  '2026-08-01':{type:'sat',name:'AYC Sat'},
  '2026-09-05':{type:'sat',name:'AYC Sat'},

  // Spring Opener
  '2026-05-23':{type:'offshore',name:'Spring Opener'},
  '2026-05-24':{type:'offshore',name:'Spring Opener'},

  // Chicago-Waukegan offshore
  '2026-06-20':{type:'offshore',name:'Chicago→Waukegan'},
  '2026-06-21':{type:'offshore',name:'Waukegan→Chicago'},

  // Chicago-Hammond offshore
  '2026-08-15':{type:'offshore',name:'Chicago→Hammond'},
  '2026-08-16':{type:'offshore',name:'Hammond→Chicago'},

  // Tri-State / Bi-State
  '2026-09-04':{type:'offshore',name:'Tri-State Leg 1'},
  '2026-09-06':{type:'offshore',name:'Bi-State / Tri-State Leg 2'},
  '2026-09-07':{type:'offshore',name:'Tri-State Leg 3'},

  // Helly Hansen
  '2026-06-05':{type:'offshore',name:'Helly Hansen'},
  '2026-06-06':{type:'offshore',name:'Helly Hansen'},
  '2026-06-07':{type:'offshore',name:'Helly Hansen'},

  // Race to Mackinac
  '2026-07-11':{type:'offshore',name:'Race to Mac'},

  // CYC Verve Cup
  '2026-08-07':{type:'offshore',name:'Verve Cup'},
  '2026-08-08':{type:'offshore',name:'Verve Cup'},
  '2026-08-09':{type:'offshore',name:'Verve Cup'},

  // MORF Open
  '2026-09-20':{type:'offshore',name:'MORF Open'},

  // GLIOR
  '2026-09-25':{type:'offshore',name:'GLIOR'},
  '2026-09-26':{type:'offshore',name:'GLIOR'},
  '2026-09-27':{type:'offshore',name:'GLIOR'},
};
const seasonStart=new Date(2026,4,1),seasonEnd=new Date(2026,8,30);
const today=new Date();today.setHours(0,0,0,0);
let curYear=2026,curMonth=4,crewData=[];

function isoKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function dayClass(y,m,d){const k=isoKey(y,m,d);if(regattas[k])return 'regatta';const dow=new Date(y,m,d).getDay();if(dow===4)return 'thu';if(dow===2)return 'tue';if(dow===3)return 'wed';return '';}
function dayTypeName(cls){return{thu:'Race Thursday',tue:'Practice Tuesday',wed:'Wednesday Sail',regatta:'Regatta'}[cls]||'';}
function dayTypeBadge(cls){return{thu:'thu-badge',tue:'tue-badge',wed:'wed-badge',regatta:'regatta-badge'}[cls]||'';}

function buildDayMap(){
  const map={};
  crewData.forEach(person=>{
    if(!person.days) return;
    person.days.split(', ').forEach(label=>{
      label=label.trim();
      if(!label) return;
      if(!map[label]) map[label]={names:[],beers:[]};
      map[label].names.push(person.name);
      if(person.beer && person.beer!=='None'){
        person.beer.split(', ').forEach(b=>{if(b.trim()===label) map[label].beers.push(person.name);});
      }
    });
  });
  return map;
}

function labelForDate(y,m,d){
  const date=new Date(y,m,d);
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()];
  return dow+' '+MONTHS[m].slice(0,3)+' '+d;
}

function renderCal(){
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  DOWS.forEach(d=>{const el=document.createElement('div');el.className='dow';el.textContent=d;grid.appendChild(el);});
  const firstDow=new Date(curYear,curMonth,1).getDay(),dim=new Date(curYear,curMonth+1,0).getDate();
  const dayMap=buildDayMap();
  for(let i=0;i<firstDow;i++){const el=document.createElement('div');el.className='cd empty';grid.appendChild(el);}
  for(let d=1;d<=dim;d++){
    const date=new Date(curYear,curMonth,d);
    const isPast=date<today,out=date<seasonStart||date>seasonEnd;
    const dc=dayClass(curYear,curMonth,d);
    const label=labelForDate(curYear,curMonth,d);
    const dayInfo=dayMap[label];
    const el=document.createElement('div');
    el.className='cd'+(dc?' '+dc:'')+(isPast||out?' past':'')+(dayInfo?' has-crew':'');
    const num=document.createElement('div');num.className='num';num.textContent=d;el.appendChild(num);
    if(dayInfo){
      const cc=document.createElement('div');cc.className='crew-count';cc.textContent=dayInfo.names.length+'👤';el.appendChild(cc);
      const tt=document.createElement('div');tt.className='tooltip';
      tt.innerHTML=dayInfo.names.join('<br>')+(dayInfo.beers.length?'<br>🍺 '+dayInfo.beers.join(', '):'');
      el.appendChild(tt);
    }
    grid.appendChild(el);
  }
  document.getElementById('cal-title').textContent=MONTHS[curMonth]+' '+curYear;
}

function renderList(){
  const dayMap=buildDayMap();
  const wrap=document.getElementById('list-wrap');wrap.innerHTML='';
  // Build sorted list of all sailing days in season
  const allDays=[];
  for(let m=4;m<=8;m++){
    const dim=new Date(2026,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const date=new Date(2026,m,d);
      if(date<today) continue;
      const dc=dayClass(2026,m,d);
      if(!dc) continue;
      const label=labelForDate(2026,m,d);
      allDays.push({label,dc,date});
    }
  }
  allDays.forEach(({label,dc})=>{
    const info=dayMap[label]||{names:[],beers:[]};
    const row=document.createElement('div');row.className='day-row';
    const typeName=dayTypeName(dc),badgeCls=dayTypeBadge(dc);
    row.innerHTML='<div class="day-label">'+label+(typeName?'<span class="day-type '+badgeCls+'">'+typeName+'</span>':'')+'</div>';
    const chips=document.createElement('div');chips.className='crew-chips';
    if(info.names.length===0){
      chips.innerHTML='<span class="empty-day">No one signed up yet</span>';
    } else {
      info.names.forEach(name=>{
        const chip=document.createElement('div');chip.className='chip';
        chip.textContent=name+(info.beers.includes(name)?' 🍺':'');
        chips.appendChild(chip);
      });
    }
    row.appendChild(chips);
    wrap.appendChild(row);
  });
}

function showTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='calendar')||(i===1&&t==='list')));
  document.getElementById('calendar-view').style.display=t==='calendar'?'block':'none';
  document.getElementById('list-view').style.display=t==='list'?'block':'none';
}

function changeMonth(dir){
  curMonth+=dir;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderCal();
}

fetch(SCRIPT_URL+'?action=crew', {redirect: 'follow'})  
  .then(r=>r.json())
  .then(data=>{
    crewData=data.crew||[];
    document.getElementById('cal-loading').style.display='none';
    document.getElementById('list-loading').style.display='none';
    document.getElementById('cal-wrap').style.display='block';
    document.getElementById('list-wrap').style.display='block';
    renderCal();
    renderList();
  })
  .catch(()=>{
    document.getElementById('cal-loading').textContent='Could not load schedule. Try refreshing.';
    document.getElementById('list-loading').textContent='Could not load schedule. Try refreshing.';
  });
</script>
</body>
</html>
